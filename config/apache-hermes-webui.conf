# Apache vhost fragment voor Plesk — bodhi.aibuddha.net
# Plaats in: /var/www/vhosts/system/bodhi.aibuddha.net/conf/vhost_ssl.conf
# (of vhost.conf voor HTTP-only)
#
# Zorg dat deze modules aan staan:
#   a2enmod proxy proxy_http
#   systemctl reload apache2

# Hermes WebUI — full AI workspace (Kanban, tasks, skills, chat)
# Deze proxy stuurt /webui/ verkeer naar de Hermes WebUI container op poort 8787
ProxyPass /webui/ http://127.0.0.1:8787/
ProxyPassReverse /webui/ http://127.0.0.1:8787/

# WebSocket support voor real-time features
RewriteEngine On
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/webui/(.*) ws://127.0.0.1:8787/$1 [P,L]
