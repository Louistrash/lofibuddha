<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2a2a"/>
      <stop offset="100%" stop-color="#0a1414"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)"/>

  <!-- Subtle outer ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#d4a44a" stroke-width="0.5" opacity="0.2"/>

  <!-- Headphone band (arc over head) -->
  <path d="M28 28 C28 12 72 12 72 28" fill="none" stroke="#d4a44a" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- Headphone ear cups -->
  <rect x="22" y="30" width="10" height="18" rx="5" fill="#d4a44a" opacity="0.85"/>
  <rect x="68" y="30" width="10" height="18" rx="5" fill="#d4a44a" opacity="0.85"/>

  <!-- Ear cup inner detail -->
  <rect x="25" y="33" width="4" height="12" rx="2" fill="#0a1414" opacity="0.6"/>
  <rect x="71" y="33" width="4" height="12" rx="2" fill="#0a1414" opacity="0.6"/>

  <!-- Buddha head -->
  <circle cx="50" cy="42" r="15" fill="#d4a44a" opacity="0.72"/>

  <!-- Hair curls / ushnisha -->
  <circle cx="44" cy="33" r="2.5" fill="#c49440" opacity="0.8"/>
  <circle cx="50" cy="31" r="2.5" fill="#c49440" opacity="0.8"/>
  <circle cx="56" cy="33" r="2.5" fill="#c49440" opacity="0.8"/>
  <circle cx="47" cy="30" r="2" fill="#c49440" opacity="0.7"/>
  <circle cx="53" cy="30" r="2" fill="#c49440" opacity="0.7"/>
  <circle cx="50" cy="28" r="2.5" fill="#c49440" opacity="0.6"/>

  <!-- Eyes (closed, meditative) -->
  <path d="M42 41 C44 43 46 43 48 41" fill="none" stroke="#0a1414" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M52 41 C54 43 56 43 58 41" fill="none" stroke="#0a1414" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Urna (forehead dot) -->
  <circle cx="50" cy="37" r="1.2" fill="#e0b860" opacity="0.8"/>

  <!-- Nose -->
  <path d="M50 42 L50 46 L48 47" fill="none" stroke="#b89030" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Mouth (serene smile) -->
  <path d="M47 49 C48 51 52 51 53 49" fill="none" stroke="#b89030" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Neck -->
  <rect x="46" y="55" width="8" height="6" rx="2" fill="#d4a44a" opacity="0.45"/>

  <!-- Shoulders / robe -->
  <path d="M38 62 C42 58 46 57 50 57 C54 57 58 58 62 62 L64 72 C64 78 58 82 50 82 C42 82 36 78 36 72Z" fill="#d4a44a" opacity="0.35"/>

  <!-- Robe detail line -->
  <path d="M50 57 L50 80" fill="none" stroke="#d4a44a" stroke-width="0.5" opacity="0.2"/>

  <!-- Subtle glow behind buddha -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#d4a44a" stroke-width="0.3" opacity="0.12"/>
</svg>
