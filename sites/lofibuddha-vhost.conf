# lofibuddha.com — Apache vhost.conf
# Path: /var/www/vhosts/system/lofibuddha.com/conf/vhost.conf
# Copy to vhost_ssl.conf for HTTPS

# Root → landing page
ProxyPass / http://172.17.0.3:3000/landing
ProxyPassReverse / http://172.17.0.3:3000/landing

# All other paths → Next.js app directly
ProxyPass /browse http://172.17.0.3:3000/browse
ProxyPassReverse /browse http://172.17.0.3:3000/browse

ProxyPass /legal http://172.17.0.3:3000/legal
ProxyPassReverse /legal http://172.17.0.3:3000/legal

ProxyPass /signup http://172.17.0.3:3000/signup
ProxyPassReverse /signup http://172.17.0.3:3000/signup

ProxyPass /api http://172.17.0.3:3000/api
ProxyPassReverse /api http://172.17.0.3:3000/api

ProxyPass /_next http://172.17.0.3:3000/_next
ProxyPassReverse /_next http://172.17.0.3:3000/_next

ProxyPass /success http://172.17.0.3:3000/success
ProxyPassReverse /success http://172.17.0.3:3000/success

ProxyPass /cancel http://172.17.0.3:3000/cancel
ProxyPassReverse /cancel http://172.17.0.3:3000/cancel
