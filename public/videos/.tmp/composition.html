<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    background: #0f0f0f;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  /* ── Rain canvas ── */
  canvas#rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }
  /* ── Vignette ── */
  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  }
  /* ── Warm glow ── */
  .glow {
    position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
    width: 60%; height: 40%;
    background: radial-gradient(ellipse, rgba(196,148,100,0.15), transparent 70%);
    z-index: 3;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
  }
  /* ── Particles ── */
  .particles { position: absolute; inset: 0; z-index: 4; }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(212,180,138,0.6);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.8; }
    100% { transform: translateY(-400px) translateX(20px); opacity: 0; }
  }
  /* ── Caption ── */
  .caption-wrap {
    position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
    z-index: 10; text-align: center; width: 85%;
  }
  .caption {
    color: #e8e2d8; font-size: 43px;
    font-weight: 400; letter-spacing: 0.08em; line-height: 1.6;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    animation: fadeIn 2s ease-out, zoomIn 15s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes zoomIn {
    from { transform: scale(0.95); }
    to { transform: scale(1.02); }
  }
  /* ── Subtitle ── */
  .subtitle {
    color: #9a9488; font-size: 24px;
    margin-top: 16px;
    letter-spacing: 0.12em; text-transform: uppercase;
    opacity: 0; animation: fadeIn 2s 1s ease-out forwards;
  }
  /* ── Brand ── */
  .brand {
    position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
    z-index: 10; color: #6b655a; font-size: 19px;
    letter-spacing: 0.15em;
    opacity: 0; animation: fadeIn 2s 2s ease-out forwards;
  }
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="vignette"></div>
  <div class="glow"></div>
  <div class="particles" id="particles"></div>
  <div class="caption-wrap">
    <div class="caption">Relax and unwind.\nYour mind deserves silence.</div>
    <div class="subtitle">Mindfulness & Relaxation</div>
  </div>
  <div class="brand">lofibuddha.com</div>

  <script>
    // ── Rain effect ──
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = 1080; canvas.height = 1080;
    const drops = Array.from({length: 120}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 2 + Math.random() * 4,
      len: 5 + Math.random() * 12,
      opacity: 0.1 + Math.random() * 0.3
    }));
    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(180,200,220,1)';
      ctx.lineWidth = 0.5;
      for (const d of drops) {
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 1, d.y + d.len);
        ctx.globalAlpha = d.opacity;
        ctx.stroke();
        d.y += d.speed;
        if (d.y > canvas.height) { d.y = -d.len; d.x = Math.random() * canvas.width; }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(drawRain);
    }
    drawRain();

    // ── Floating particles ──
    const container = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = (60 + Math.random() * 40) + '%';
      p.style.animationDelay = Math.random() * 6 + 's';
      p.style.animationDuration = (4 + Math.random() * 8) + 's';
      container.appendChild(p);
    }
  </script>
</body>
</html>
