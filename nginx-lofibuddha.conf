server {
    server_name lofibuddha.com www.lofibuddha.com;

    client_max_body_size 100M;

    # ============================================================
    # Next.js backend + CMS + legal (behouden)
    # ============================================================

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        include /etc/nginx/proxy_headers.inc;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3000/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Serve generated videos directly from filesystem
    location /videos/ {
        alias /opt/data/bodhi-dashboard/public/videos/;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        types {
            video/mp4 mp4;
            video/webm webm;
        }
    }

    # ---- CMS / dashboard single-page routes (exact) ----
    location = /login       { proxy_pass http://127.0.0.1:3000/login;       include /etc/nginx/proxy_headers.inc; }
    location = /studio      { proxy_pass http://127.0.0.1:3000/studio;      include /etc/nginx/proxy_headers.inc; }
    location = /social      { proxy_pass http://127.0.0.1:3000/social;      include /etc/nginx/proxy_headers.inc; }
    location = /settings    { proxy_pass http://127.0.0.1:3000/settings;    include /etc/nginx/proxy_headers.inc; }
    location = /subscribers { proxy_pass http://127.0.0.1:3000/subscribers; include /etc/nginx/proxy_headers.inc; }
    location = /sounds      { proxy_pass http://127.0.0.1:3000/sounds;      include /etc/nginx/proxy_headers.inc; }
    location = /analytics   { proxy_pass http://127.0.0.1:3000/analytics;   include /etc/nginx/proxy_headers.inc; }
    location = /newsletter  { proxy_pass http://127.0.0.1:3000/newsletter;  include /etc/nginx/proxy_headers.inc; }
    location = /courses     { proxy_pass http://127.0.0.1:3000/courses;     include /etc/nginx/proxy_headers.inc; }
    location = /hermes      { proxy_pass http://127.0.0.1:3000/hermes;      include /etc/nginx/proxy_headers.inc; }
    location = /video       { proxy_pass http://127.0.0.1:3000/video;       include /etc/nginx/proxy_headers.inc; }
    location = /images      { proxy_pass http://127.0.0.1:3000/images;      include /etc/nginx/proxy_headers.inc; }

    # ---- Content (prefix: has sub-routes) ----
    location /content {
        proxy_pass http://127.0.0.1:3000/content;
        include /etc/nginx/proxy_headers.inc;
    }

    # ---- Stripe flow + member app ----
    location = /signup  { proxy_pass http://127.0.0.1:3000/signup;  include /etc/nginx/proxy_headers.inc; }
    location = /success { proxy_pass http://127.0.0.1:3000/success; include /etc/nginx/proxy_headers.inc; }
    location = /cancel  { proxy_pass http://127.0.0.1:3000/cancel;  include /etc/nginx/proxy_headers.inc; }
    location = /app     { proxy_pass http://127.0.0.1:3000/app;     include /etc/nginx/proxy_headers.inc; }

    # ============================================================
    # Expo web app (Mindfulness OS) — default / SPA
    # ============================================================

    root /opt/data/bodhi-dashboard/mobile/dist;

    location = / {
        try_files /index.html =404;
    }

    # Static assets + prerendered routes + SPA fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lofibuddha.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lofibuddha.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.lofibuddha.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = lofibuddha.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lofibuddha.com www.lofibuddha.com;
    return 404; # managed by Certbot
}
